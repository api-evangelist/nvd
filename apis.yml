aid: nvd
name: NVD
description: >-
  The National Vulnerability Database (NVD) provides REST APIs for CVE (Common Vulnerabilities and Exposures) data, CPE
  (Common Platform Enumeration) records, match criteria, and source organizations. APIs deliver vulnerability
  descriptions, CVSS severity scores, affected product lists, CWE classifications, and reference links for security
  monitoring and dependency alerting.
